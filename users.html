{% extends "base.html" %}{% block title %}Users{% endblock %}
{% block content %}
<h4 style="color:#1f3864;">Users</h4>
<div class="row g-3">
<div class="col-lg-5"><div class="card shadow-sm"><div class="card-body">
  <h6>Add user</h6>
  <form method="post" action="{{ url_for('users_new') }}">
    <div class="mb-2"><label class="form-label small">Username</label><input class="form-control form-control-sm" name="username" required></div>
    <div class="mb-2"><label class="form-label small">Full name</label><input class="form-control form-control-sm" name="full_name"></div>
    <div class="mb-2"><label class="form-label small">Password</label><input class="form-control form-control-sm" type="password" name="password" required></div>
    <div class="mb-2"><label class="form-label small">Role</label>
      <select class="form-select form-select-sm" name="role"><option value="user">user</option><option value="admin">admin</option></select></div>
    <button class="btn btn-sm btn-primary" style="background:#1f3864;border:0;">Create user</button>
  </form>
</div></div></div>
<div class="col-lg-7"><div class="card shadow-sm"><div class="card-body table-responsive">
  <table class="table table-sm"><thead><tr><th>Username</th><th>Name</th><th>Role</th><th></th></tr></thead><tbody>
  {% for u in rows %}<tr><td>{{ u.username }}</td><td>{{ u.full_name or '' }}</td>
    <td><span class="badge bg-{{ 'dark' if u.role=='admin' else 'secondary' }}">{{ u.role }}</span></td>
    <td class="text-end">
      <form method="post" action="{{ url_for('users_reset', uid=u.id) }}" class="d-inline">
        <input type="password" name="password" placeholder="new pw" class="form-control form-control-sm d-inline" style="width:110px">
        <button class="btn btn-sm btn-outline-secondary">Reset</button></form>
      <form method="post" action="{{ url_for('users_delete', uid=u.id) }}" class="d-inline" onsubmit="return confirm('Delete user?')">
        <button class="btn btn-sm btn-outline-danger">Delete</button></form>
    </td></tr>{% endfor %}
  </tbody></table>
</div></div></div>
</div>
{% endblock %}
